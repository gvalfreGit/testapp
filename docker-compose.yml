version: '3.9'
services:
  mongodb:
    image: mongo:7
    container_name: familyhub-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    image: node:20
    container_name: familyhub-api
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./backend:/app
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/familyhub
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - mongodb

  web:
    image: node:20
    container_name: familyhub-web
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:4000/api
    depends_on:
      - api

volumes:
  mongo_data:
